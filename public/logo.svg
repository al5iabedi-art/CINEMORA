<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1c160e"/>
      <stop offset="55%" stop-color="#100d09"/>
      <stop offset="100%" stop-color="#07070a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbe8bd"/>
      <stop offset="45%" stop-color="#e3bd76"/>
      <stop offset="75%" stop-color="#b8934f"/>
      <stop offset="100%" stop-color="#8a6a37"/>
    </linearGradient>
  </defs>

  <!-- outer badge -->
  <circle cx="160" cy="160" r="156" fill="url(#bg)"/>
  <circle cx="160" cy="160" r="150" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="160" cy="160" r="140" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.55"/>

  <!-- ring band where the curved word sits -->
  <circle cx="160" cy="160" r="122" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.35"/>

  <!-- invisible paths for curved text -->
  <path id="topArc" d="M 46 160 A 114 114 0 0 1 274 160" fill="none"/>
  <path id="bottomArc" d="M 60 220 A 100 100 0 0 0 260 220" fill="none"/>

  <!-- MORA curving along the top of the ring, like a crest banner -->
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="34" letter-spacing="10" fill="url(#gold)">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">MORA</textPath>
  </text>

  <!-- CINEMORA small word along the bottom arc -->
  <text font-family="Arial, sans-serif" font-weight="600" font-size="13" letter-spacing="6" fill="#cbb27c" opacity="0.9">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">CINEMORA</textPath>
  </text>

  <!-- two small stars flanking the bottom arc like a crest -->
  <g fill="url(#gold)">
    <path d="M64,210 l2.4,5.2 5.6,0.8 -4,4 1,5.6 -5,-2.7 -5,2.7 1,-5.6 -4,-4 5.6,-0.8 Z"/>
    <path d="M256,210 l2.4,5.2 5.6,0.8 -4,4 1,5.6 -5,-2.7 -5,2.7 1,-5.6 -4,-4 5.6,-0.8 Z"/>
  </g>

  <!-- thin inner ring separating the band from the center emblem -->
  <circle cx="160" cy="160" r="86" fill="none" stroke="url(#gold)" stroke-width="1.4" opacity="0.6"/>

  <!-- central sunburst behind the C -->
  <g stroke="url(#gold)" stroke-width="1" opacity="0.35">
    <line x1="160" y1="82" x2="160" y2="96"/>
    <line x1="160" y1="224" x2="160" y2="238"/>
    <line x1="82" y1="160" x2="96" y2="160"/>
    <line x1="224" y1="160" x2="238" y2="160"/>
    <line x1="103" y1="103" x2="113" y2="113"/>
    <line x1="207" y1="207" x2="217" y2="217"/>
    <line x1="103" y1="217" x2="113" y2="207"/>
    <line x1="207" y1="113" x2="217" y2="103"/>
  </g>

  <!-- large central C, cut like a camera-aperture shutter -->
  <path d="M160 100
           A60 60 0 1 0 216 168
           L190 168
           A34 34 0 1 1 160 126
           A34 34 0 0 1 184.5 137
           L206 122
           A60 60 0 0 0 160 100 Z"
        fill="url(#gold)"/>
  <circle cx="160" cy="160" r="6" fill="#07070a"/>
</svg>
